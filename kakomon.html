function say(){let m;do{m=MSG[Math.floor(Math.random()*MSG.length)]}while(m===lastMsg&&MSG.length>1);lastMsg=m;setMsg(m);msEl.classList.remove("pop");void msEl.offsetWidth;msEl.classList.add("pop")}
let seen=false;try{seen=localStorage.getItem("kakomon-seen")==="1";localStorage.setItem("kakomon-seen","1")}catch(e){}

const toastEl=document.getElementById("toast");let tt=0;

function cheer(v){const all=[...new Set(Object.values(DATA).flatMap(a=>a.flatMap(x=>x.g.flatMap(g=>g.i))))],n=all.length,dn=all.filter(x=>done.has(x)).length,vi=v.g.flatMap(g=>g.i),vd=vi.filter(x=>done.has(x)).length;let m=null;
 if(dn===n)m="ぜんぶ解けたにゃ！！！ほんとにえらいにゃ";
 else if(dn===1)m="最初の1問できたにゃ！えらいにゃ！";
 else if(v.v&&vd===vi.length)m=v.v+" ぜんぶ終わったにゃ！";
 else if(dn===Math.ceil(n*.75))m="75%こえたにゃ！あとちょっとにゃ";
 else if(dn===Math.ceil(n*.5))m="半分こえたにゃ！すごいにゃ";
 else if(dn===Math.ceil(n*.25))m="4分の1できたにゃ！";
 else if(dn%10===0)m=dn+"問できたにゃ！";
 else if(Math.random()<.5)m=CHEER[Math.floor(Math.random()*CHEER.length)];
 if(m)toast(m)}

const thEl=document.getElementById("th");
function setTh(k,keep){if(!TH.some(t=>t[0]===k))k="neko";document.documentElement.dataset.th=k;if(!keep)try{localStorage.setItem("kakomon-theme",k)}catch(e){};thEl.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));bg()}
TH.forEach(([k,n,c])=>{const b=document.createElement("button");b.dataset.k=k;b.style.background=c;b.title=n;b.setAttribute("aria-label",n+"の配色");b.onclick=()=>setTh(k);thEl.append(b)});
setTh(document.documentElement.dataset.th,true);
function render(){
 const m=document.getElementById("m");m.textContent="";
 Object.keys(DATA).forEach((k,i)=>{const b=document.getElementById("t"+i);b.textContent=k;b.setAttribute("aria-pressed",k===tab);b.onclick=()=>{tab=k;try{localStorage.setItem("kakomon-tab",k)}catch(e){}render();scrollTo(0,0)}});
 const fv=document.getElementById("fv");fv.setAttribute("aria-pressed",only);fv.textContent="";fv.append(svgEl("star"),"お気に入り ("+favs.size+")");
 vis=[];secs=[];let shown=0,total=0;
 DATA[tab].forEach((v,vi)=>{
  const sec=document.createElement("section");let any=false;
  v.g.forEach(g=>{
   const items=g.i.filter(p=>!only||favs.has(p));total+=g.i.length;if(!items.length)return;
   if(!any){any=true;if(v.v){const h=document.createElement("h2"),e=document.createElement("i");e.append(svgEl(v.e||EMO[vi%EMO.length]));const vt=v.g.reduce((n,g)=>n+g.i.length,0),vd=v.g.reduce((n,g)=>n+g.i.filter(p=>done.has(p)).length,0),q=document.createElement("span");q.className="vc";q.textContent=vd+" / "+vt;h.append(e,v.v,q);sec.append(h);secs.push({n:v.v,el:h,vd,vt})}}
   if(g.n){const h=document.createElement("h3");h.textContent=g.n;sec.append(h)}
   items.forEach(p=>{shown++;vis.push(p);const d=document.createElement("div");d.className="it"+(done.has(p)?" dn":"")+(opened.has(p)?" op":"");
    const[h,l1,l2]=lab(p);
    const a=document.createElement("a");a.href=SITE[h]+p.split(":")[1]+".html";a.target="_blank";a.rel="noopener";const mk=()=>{if(!opened.has(p)){opened.add(p);saveO()}d.classList.add("op")};a.addEventListener("click",mk);a.addEventListener("auxclick",mk);
    const t=document.createElement("span");t.className="bd "+h;t.textContent=TAG[h];a.append(t,l1+" "+l2);
    const b=document.createElement("button");b.className="st"+(last===p?" pop":"");b.append(svgEl("star"));b.setAttribute("aria-label","お気に入り");b.setAttribute("aria-pressed",favs.has(p));
    b.onclick=()=>{favs.has(p)?favs.delete(p):favs.add(p);last=p;save();render();last=null};
    const c=document.createElement("button");c.className="ck";c.append(svgEl("check"));c.setAttribute("aria-label","できた");c.setAttribute("aria-pressed",done.has(p));c.onclick=()=>{const was=done.has(p);was?done.delete(p):done.add(p);saveD();render();if(!was)cheer(v)};d.append(a,c,b);sec.append(d)})});
  if(any)m.append(sec)});
 document.getElementById("cn").textContent=shown+" / "+total+" 問";
 if(!shown){const e=document.createElement("div");e.className="emp";const b=document.createElement("b");b.append(svgEl(only?"sil":"paw"));e.append(b,only?"まだ★はないよ。まちがえた問題の☆をタップしてね":"問題がありません");m.append(e)}
 const all=[...new Set(Object.values(DATA).flatMap(a=>a.flatMap(v=>v.g.flatMap(g=>g.i))))],dn=all.filter(p=>done.has(p)).length;
 document.getElementById("pb").style.width=(dn/all.length*100)+"%";document.getElementById("pt").textContent="できた "+dn+" / "+all.length+"（"+Math.round(dn/all.length*100)+"%）";
 if(dn&&dn===all.length){const z=document.createElement("div");z.className="emp clr";const b=document.createElement("b");b.append(svgEl("hachi"));const bt=document.createElement("button");bt.className="pill";bt.textContent="✓をぜんぶはずして最初から";arm(bt,bt.textContent,()=>{done.clear();saveD();render();scrollTo(0,0)});const p=document.createElement("p");p.textContent="ぜんぶ解けたにゃ！おつかれさま";z.append(b,p,bt);m.prepend(z)}
 else if(done.size){const f=document.createElement("div");f.className="ft";const b=document.createElement("button");b.textContent="✓をぜんぶはずす";arm(b,"✓をぜんぶはずす",()=>{done.clear();saveD();render()});f.append(b);m.append(f)}
 if(opened.size){const f=document.createElement("div");f.className="ft";const b=document.createElement("button");b.textContent="開いた記録をぜんぶ消す";arm(b,"開いた記録をぜんぶ消す",()=>{opened.clear();saveO();render()});f.append(b);m.append(f)}
 if(favs.size){const f=document.createElement("div");f.className="ft";const b=document.createElement("button");b.textContent="★をぜんぶはずす";arm(b,"★をぜんぶはずす",()=>{favs.clear();save();render()});f.append(b);m.append(f)}
}
let secs=[];
const sheet=document.getElementById("sheet"),sp=document.getElementById("sp"),jp=document.getElementById("jp");let lastFocus=null;

function goTo(el){closeSheet();const bh=document.querySelector(".bar").offsetHeight,calm=matchMedia("(prefers-reduced-motion:reduce)").matches;requestAnimationFrame(()=>{scrollTo({top:el.getBoundingClientRect().top+scrollY-bh-10,behavior:calm?"auto":"smooth"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")})}

function openSheet(){if(!secs.length)return;lastFocus=document.activeElement;sp.textContent="";
 const hd=document.createElement("div");hd.className="sh";const t=document.createElement("b");t.textContent="章へ移動（"+tab+"）";const x=document.createElement("button");x.className="pill sx";x.textContent="✕";x.setAttribute("aria-label","閉じる");x.onclick=closeSheet;hd.append(t,x);sp.append(hd);
 const nx=secs.find(c=>c.vd<c.vt);
 if(nx){const g=document.createElement("div");g.className="sg";const b=document.createElement("button");b.className="sc go";const a=document.createElement("span");a.textContent="つづきから（"+nx.n+"）";const r=document.createElement("small");r.textContent=nx.vd+" / "+nx.vt;b.append(a,r);b.onclick=()=>goTo(nx.el);g.append(b);sp.append(g)}
 const isM=c=>/[~〜～]/.test(c.n),main=secs.filter(c=>!isM(c)),sum=secs.filter(isM);
 [["",main],["まとめ",sum]].forEach(([lb,a])=>{if(!a.length)return;if(lb){const l=document.createElement("div");l.className="sl";l.textContent=lb;sp.append(l)}const g=document.createElement("div");g.className="sg";a.forEach(c=>g.append(chip(c)));sp.append(g)});
 sheet.classList.add("on");sheet.setAttribute("aria-hidden","false");document.documentElement.style.overflow="hidden";sp.scrollTop=0;(sp.querySelector(".sc")||x).focus()}
sheet.onclick=e=>{if(e.target===sheet)closeSheet()};
addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet.classList.contains("on"))closeSheet()});
jp.prepend(svgEl("list"));jp.onclick=openSheet;
